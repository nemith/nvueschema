[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "nvueschema"
version = "0.1.0"
description = "NVUE Pydantic models and optional Go-backed configuration validation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
full = ["nvueschema-binary==0.1.0"]

[project.urls]
Repository = "https://github.com/nemith/nvueschema"

[tool.uv.sources]
nvueschema-binary = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/nvueschema"]

[tool.hatch.build]
artifacts = ["src/nvueschema/models/v*.py", "src/nvueschema/models/_versions.py"]

[tool.hatch.build.hooks.custom]
