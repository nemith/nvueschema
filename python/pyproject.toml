[tool.uv.workspace]
members = ["nvueschema", "nvueschema-binary"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
exclude = ["nvueschema/src/nvueschema/models/v*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["nvueschema", "nvueschema_binary"]
